name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v

  windows-exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -c "import work_counter"
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --noconsole --name WorkCounter work_counter.py
      - uses: actions/upload-artifact@v4
        with:
          name: WorkCounter
          path: dist/WorkCounter.exe
      - name: Read version
        id: v
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      - name: Publish release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Work Counter v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/WorkCounter.exe
          make_latest: true
